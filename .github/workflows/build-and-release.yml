name: Build and Package Extension

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run Tests
        run: npm test

      - name: Package VSIX
        run: npx @vscode/vsce package --no-git-tag-version

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-hub-vsix
          path: '*.vsix'
          if-no-files-found: error

      - name: Check publishing credentials
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]; then
            echo "::error::Git tag version does not match package.json version $VERSION."
            exit 1
          fi
          if [ -z "$OVSX_PAT" ] || [ -z "$VSCE_PAT" ]; then
            echo "::error::Both OVSX_PAT and VSCE_PAT are required to publish a release to Open VSX and VS Code Marketplace."
            exit 1
          fi

      - name: Publish to Open VSX (Cursor)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          PUBLISHER=$(node -p "require('./package.json').publisher")
          npx ovsx create-namespace "$PUBLISHER" || true
          npx ovsx publish *.vsix

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath *.vsix

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
